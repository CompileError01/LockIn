[package]
name = "digi_download_core"
version = "0.1.0"
license = "MIT"
edition = "2021"

[dependencies]
reqwest = { version = "0.12.3", default-features = false, features = ["cookies", "rustls-tls", "http2"] }
scraper = "0.23.1"
regex = "1.10.3"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7.1"
chrono = "0.4"
svg2pdf = "0.13.0"
lopdf = "0.36.0"
base64 = "0.22.0"
async-trait = "0.1.77"
thiserror = "2.0.3"
getset = "0.1.2"
